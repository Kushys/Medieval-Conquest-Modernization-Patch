; Medieval Conquest Modernization Patch v1.0.0
; Edit with the game closed. 1 = on, 0 = off. Restart to apply.

[UI]
; UI size in percent, chosen automatically for the game's actual resolution.
; 125, 150, 175, and 200 are tested and supported.
; 1080p and 4K are experimental; 1440p is the tested configuration.
Scale1080p=125
Scale1440p=150
Scale2160p=200
; Enable UI scaling when the game starts.
StartEnabled=1
; Sharper text. Turn off if fonts cause problems.
HighResolutionFonts=1
; Cache font rendering for better performance.
FontCache=1
; Scale tooltips and the expanded minimap with the UI.
Tooltips=1
ExpandedMap=1
; Use smaller minimap markers instead of proportional scaling.
SmallMapMarkers=0

[Camera]
; Hold middle mouse to pan camera; scroll wheel to zoom.
MiddleMouseDrag=1
MouseWheelZoom=1
; Sensitivity in percent (10-400); 80 = default.
DragSensitivity=80
WheelSensitivity=80
; Reverse middle-mouse drag direction.
InvertDrag=0
; F1-F4 recall saved views; Ctrl+F1-F4 save them.
; Off restores native Home button behavior
CameraBookmarks=1
; Restore position, rotation, tilt and zoom; 0 restores position only.
BookmarkRestoreView=1

[GameHotkeys]
; Enable configurable game shortcuts. Off restores native keyboard input.
Enabled=1
; Move the camera continuously while keys are held.
ContinuousCamera=1
; Up to four comma-separated keys per action; Empty disables a binding.
; No modifier chords. Do not reuse keys or use 1-6 or F5-F12.
; F1-F4 are also reserved while camera bookmarks are on.
PanUp=Up
PanDown=Down
PanLeft=Left
PanRight=Right
RotateLeft=A,Q
RotateRight=D,E
TiltDown=W
TiltUp=S
ZoomIn=NumPadPlus
ZoomOut=NumPadMinus
; Home binding only applies when CameraBookmarks=0.
Home=H
MessageHistory=B
ExpandedMap=M
Pause=Space
Options=Escape
SpeedNormal=Z
SpeedFast=X
SpeedFastest=C

[ModHotkeys]
; Toggle UI scaling; restore original UI size without changing the INI.
; Use unassigned function keys (F5/F6 or F13-F24 recommended).
ToggleUIScaling=F5
RestoreNativeUI=F6

[Research]
; Gold dot on the active upgrade.
ActiveResearchIndicator=1
; Click other upgrade icons during research to queue them (paid upfront).
; Click a queued icon again to remove it and refund its cost.
ResearchQueue=1
; Right-click the active upgrade icon to cancel and receive a refund.
CancelResearch=1
